name: Tests

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    test:
        name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
                laravel: ['11', '12', '13']
                include:
                    - laravel: '11'
                      testbench: '9'
                    - laravel: '12'
                      testbench: '10'
                    - laravel: '13'
                      testbench: '11'
                exclude:
                    - laravel: '13'
                      php: '8.2'
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
            - name: Allow Laravel 11, which has no security fixes left
              if: matrix.laravel == '11'
              run: |
                  composer config audit.block-insecure false || true
                  composer config policy.advisories.block false || true
            - run: |
                  composer require "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-update --no-interaction
                  composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
            - run: vendor/bin/pest
